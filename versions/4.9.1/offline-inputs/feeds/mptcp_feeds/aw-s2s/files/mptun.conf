
config mptun 'global'
    option enable '0'
    option enable_mpifd '1'
    option mptun 'mptun0'
    option tcpmark '0x1'
    option udpmark '0x2'
    option lanmark '0x4'
    option dnsmark '0x8'
    option mode '0'
    option node 'default'

config mptun 'config'
    option profile '/etc/mptun/mpnet.json'
    option sys_resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'

config interface 'wan'
    option enable '1'
    option metric '1'
    option device 'eth0'
    list mptcp_flags 'subflow'

config interface 'secondwan'
    option enable '1'
    option metric '2'
    option device 'eth1'
    list mptcp_flags 'subflow'

config interface 'wwan'
    option enable '1'
    option metric '3'
    option device 'wlan-sta0'
    list mptcp_flags 'subflow'

config interface 'tethering'
    option enable '1'
    option metric '4'
    option device 'usb0'
    list mptcp_flags 'subflow'

config interface 'modem_0000_4'
    option enable '1'
    option device 'rmnet_mhi0'
    option metric '5'
    list mptcp_flags 'subflow'
